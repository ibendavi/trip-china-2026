<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>China 2026</title>
<style>
  :root{--navy:#1f3864;--teal:#2e75b6;--grey:#5b6470;--line:#dde4ec;--bg:#ffffff}
  @media (prefers-color-scheme: dark){
    :root{--navy:#9db8e8;--teal:#6ea8dc;--grey:#a3adba;--line:#2b3442;--bg:#12161c}
    body{color:#dce3ea}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#222;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{max-width:360px;width:92%;padding:34px 30px;border:1px solid var(--line);
        border-radius:10px;text-align:center}
  h1{font-size:1.25rem;color:var(--navy);margin:0 0 4px;letter-spacing:-.01em}
  p{color:var(--grey);font-size:.88rem;margin:0 0 20px}
  input{width:100%;padding:10px 12px;font-size:1rem;border:1px solid var(--line);
        border-radius:6px;background:transparent;color:inherit;text-align:center}
  input:focus{outline:2px solid var(--teal);border-color:var(--teal)}
  button{margin-top:12px;width:100%;padding:10px;font-size:.95rem;font-weight:600;
         color:#fff;background:var(--teal);border:0;border-radius:6px;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  .err{color:#c0392b;font-size:.85rem;margin-top:10px;min-height:1.2em}
  .spin{opacity:.55;pointer-events:none}
</style>
</head>
<body>
<div class="card" id="card">
  <h1>China 2026</h1>
  <p>This itinerary is private. Enter the password.</p>
  <input type="password" id="pw" autocomplete="current-password" autofocus>
  <button id="go">Open</button>
  <div class="err" id="err"></div>
</div>

function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function tryOpen(pw){
  const raw=b64(BLOB), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:salt,iterations:600000,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  return new TextDecoder().decode(pt);
}
async function go(){
  const pw=document.getElementById("pw").value;
  if(!pw) return;
  document.getElementById("card").classList.add("spin");
  document.getElementById("err").textContent="";
  try{
    const html=await tryOpen(pw);
    sessionStorage.setItem("c26",pw);
    const parsed=new DOMParser().parseFromString(html,"text/html");
    const next=document.importNode(parsed.documentElement,true);
    document.documentElement.replaceWith(next);
  }catch(e){
    document.getElementById("card").classList.remove("spin");
    document.getElementById("err").textContent="Wrong password.";
    document.getElementById("pw").select();
  }
}
document.getElementById("go").addEventListener("click",go);
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
const saved=sessionStorage.getItem("c26");
if(saved){document.getElementById("pw").value=saved;go();}
</script>
